# Alembic configuration. The database URL is intentionally NOT set here:
# alembic/env.py reads it from the DATABASE_URL environment variable.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Revision files are named <revision>_<slug>.py; pass --rev-id (e.g. 0002_xxx)
# to keep ids sequential and readable.
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
