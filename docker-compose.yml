name: claimwise-mvp

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimwise_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-claimwise_mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_mvp_only_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

volumes:
  pgdata:
